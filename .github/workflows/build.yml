name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - hotfix/add_csgo
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set variables
        id: vars
        run: |
          # Определяем версию
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=$(echo "${{ github.ref }}" | sed -e 's|refs/tags/v||')
          else
            VERSION="${{ github.sha }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build=${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo "date=$(date -Iseconds)" >> $GITHUB_OUTPUT
          echo "image_name=ghcr.io/${{ github.repository }}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=${{ steps.vars.outputs.version }} \
            --build-arg BUILD=${{ steps.vars.outputs.build }} \
            --build-arg DATE="${{ steps.vars.outputs.date }}" \
            --no-cache \
            -f deployment/Dockerfile \
            -t ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.version }} \
            .

      - name: Tag and Push Docker image
        run: |
          # Push версии
          docker push ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.version }}

          # Если это main ветка или тег - тегируем как latest и пушим
          if [[ "${{ github.ref }}" == refs/heads/main ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            docker tag ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.version }} ${{ steps.vars.outputs.image_name }}:latest
            docker push ${{ steps.vars.outputs.image_name }}:latest
          fi